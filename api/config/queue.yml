default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues:
        - transactions
      threads: 5
      polling_interval: 0.1
    - queues:
        - maintenance
        - default
      threads: 2
      polling_interval: 0.25

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
